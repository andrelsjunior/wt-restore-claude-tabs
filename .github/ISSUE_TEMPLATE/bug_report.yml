name: Bug report
description: Something did not work
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: The command you ran
      description: Please include the output of the dry run, without `--go`.
      render: shell
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `wt-restore-claude-tabs --version`, `bash --version | head -1`, `python3 --version`, and your WSL distro.
      render: shell
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: Windows Terminal is installed and `wt.exe` is on my PATH
        - label: I have session history in `~/.claude/projects`
